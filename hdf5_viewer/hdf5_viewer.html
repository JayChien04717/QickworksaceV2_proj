<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qickworkspace HDF5 Viewer</title>
<style>
:root{color-scheme:dark;--bg:#071019;--panel:#101d28;--line:#263847;--text:#e9f1f7;--muted:#8ca2b3;--cyan:#4dd9d0;--blue:#67a9ff;--bad:#ff7884;--good:#65df9b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#143344 0,transparent 35%),var(--bg);color:var(--text);font:14px/1.45 Inter,Segoe UI,sans-serif}.shell{max-width:1500px;margin:auto;padding:28px}.header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}.eyebrow{color:var(--cyan);font-size:12px;letter-spacing:.15em;text-transform:uppercase}h1{font-size:32px;margin:5px 0}.muted{color:var(--muted)}.toolbar{display:grid;grid-template-columns:minmax(280px,1fr) auto auto;gap:10px}.filters{display:grid;grid-template-columns:1fr 180px 220px;gap:10px;margin:12px 0}input,select,button{min-height:42px;border:1px solid var(--line);border-radius:9px;background:#0b1721;color:var(--text);padding:9px 12px}button{background:#173449;cursor:pointer;font-weight:650}button.primary{background:var(--cyan);color:#062026;border-color:transparent}.status{min-height:22px;color:var(--muted);margin:8px 2px}.status.error{color:var(--bad)}.layout{display:grid;grid-template-columns:minmax(580px,1.3fr) minmax(390px,.9fr);gap:16px}.panel{background:rgba(16,29,40,.94);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 18px 50px #0006}.table-wrap{max-height:72vh;overflow:auto}table{width:100%;border-collapse:collapse}th{position:sticky;top:0;background:#122431;text-align:left;color:var(--muted);padding:11px;border-bottom:1px solid var(--line)}td{padding:11px;border-bottom:1px solid #1d2d39;vertical-align:top}tr{cursor:pointer}tr:hover,tr.selected{background:#183142}.mono{font:11px ui-monospace,Consolas,monospace;color:var(--muted)}.pill{display:inline-block;padding:2px 7px;margin:2px;border:1px solid var(--line);border-radius:99px;font-size:11px}.pill.good{color:var(--good)}.pill.bad{color:var(--bad)}.detail{padding:18px;max-height:72vh;overflow:auto}.plots{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preview{width:100%;border-radius:10px;border:1px solid var(--line);background:white}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.metric{padding:10px;border:1px solid var(--line);border-radius:9px}.metric small{display:block;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#09141d;border:1px solid var(--line);padding:10px;border-radius:8px;color:#cce3ee}.empty{padding:42px;text-align:center;color:var(--muted)}@media(max-width:950px){.layout{grid-template-columns:1fr}.header{display:block}.toolbar,.filters{grid-template-columns:1fr}.plots{grid-template-columns:1fr}.shell{padding:14px}}
</style>
</head>
<body>
<main class="shell">
  <div class="header"><div><div class="eyebrow">Labber + native metagroup</div><h1>Qickworkspace HDF5 Viewer</h1><div class="muted">Browse SQLite catalog entries and inspect embedded HDF5 data and plots.</div></div></div>
  <div class="toolbar"><input id="folder" value="D:\Labber_Data\Jay\test" aria-label="Data folder"><button id="open" class="primary">Open folder</button><button id="rebuild">Rebuild SQLite</button></div>
  <div id="status" class="status"></div>
  <div class="filters"><input id="search" placeholder="Search type, ID, tag or qubit"><select id="quality"><option value="">All qualities</option></select><select id="type"><option value="">All experiment types</option></select></div>
  <section class="layout">
    <div class="panel table-wrap"><table><thead><tr><th>Time / ID</th><th>Experiment</th><th>Quality</th><th>Tags</th></tr></thead><tbody id="rows"></tbody></table></div>
    <div class="panel"><div id="detail" class="detail"><div class="empty">Choose a folder, then select an experiment.</div></div></div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const state={experiments:[],filtered:[],selected:null};
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStatus(message,error=false){$('status').textContent=message;$('status').className='status'+(error?' error':'')}
function api(path,extra=''){return `${path}?folder=${encodeURIComponent($('folder').value.trim())}${extra}`}
async function request(url,options){const response=await fetch(url,options);let body;try{body=await response.json()}catch{body={detail:await response.text()}}if(!response.ok)throw new Error(body.detail||`HTTP ${response.status}`);return body}
function populateFilters(){for(const [id,key,label] of [['quality','quality','All qualities'],['type','experiment_type','All experiment types']]){const select=$(id),current=select.value,values=[...new Set(state.experiments.map(x=>x[key]).filter(Boolean))].sort();select.innerHTML=`<option value="">${label}</option>`+values.map(v=>`<option>${esc(v)}</option>`).join('');select.value=current}}
function applyFilters(){const query=$('search').value.toLowerCase(),quality=$('quality').value,type=$('type').value;state.filtered=state.experiments.filter(item=>{const text=[item.experiment_type,item.experiment_id,...(item.tags||[]),...(item.qubits||[])].join(' ').toLowerCase();return(!query||text.includes(query))&&(!quality||item.quality===quality)&&(!type||item.experiment_type===type)});renderRows()}
function renderRows(){$('rows').innerHTML=state.filtered.map(item=>`<tr data-id="${esc(item.experiment_id)}" class="${state.selected===item.experiment_id?'selected':''}"><td>${esc(new Date(item.timestamp_local).toLocaleString())}<div class="mono">${esc(item.experiment_id)}</div></td><td>${esc(item.experiment_type)}</td><td><span class="pill ${esc(item.quality)}">${esc(item.quality)}</span></td><td>${(item.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</td></tr>`).join('');document.querySelectorAll('#rows tr').forEach(row=>row.addEventListener('click',()=>showExperiment(row.dataset.id)));setStatus(`${state.filtered.length} / ${state.experiments.length} experiments`)}
async function openFolder(){setStatus('Loading catalog...');try{const data=await request(api('/api/catalog','&limit=10000'));state.experiments=data.experiments;state.selected=null;populateFilters();applyFilters();$('detail').innerHTML=`<div class="empty">Loaded ${data.count} experiments. Select one from the table.</div>`}catch(error){setStatus(error.message,true)}}
async function rebuild(){setStatus('Scanning HDF5 files and rebuilding SQLite...');try{const data=await request(api('/api/rebuild'),{method:'POST'});setStatus(`Indexed ${data.indexed} experiments`);await openFolder()}catch(error){setStatus(error.message,true)}}
async function showExperiment(id){state.selected=id;renderRows();$('detail').innerHTML='<div class="empty">Reading HDF5...</div>';try{const info=await request(api(`/api/experiment/${encodeURIComponent(id)}`));const main=api(`/api/plot/${encodeURIComponent(id)}`,'&name=main.png')+`&v=${Date.now()}`;const analysis=api(`/api/plot/${encodeURIComponent(id)}`,'&name=analysis.png')+`&v=${Date.now()}`;$('detail').innerHTML=`<div class="plots"><div><div class="muted">main.png</div><img class="preview" src="${main}"></div><div><div class="muted">analysis.png</div><img class="preview" src="${analysis}"></div></div><div class="metrics"><div class="metric"><small>Type</small>${esc(info.experiment_type)}</div><div class="metric"><small>Quality</small>${esc(info.quality)}</div><div class="metric"><small>Group</small>${esc(info.container_group)}</div></div><h3>File</h3><pre>${esc(info.path)}</pre><h3>Raw datasets</h3><pre>${esc((info.raw_keys||[]).join('\n')||'(none)')}</pre><h3>Analysis datasets</h3><pre>${esc((info.analysis_keys||[]).join('\n')||'(none)')}</pre><h3>Axes</h3><pre>${esc(JSON.stringify(info.axes,null,2))}</pre><h3>Metadata</h3><pre>${esc(JSON.stringify(info.metadata,null,2))}</pre><h3>Validation</h3><pre>${esc(JSON.stringify({valid:info.valid,errors:info.validation_errors,warnings:info.validation_warnings},null,2))}</pre>`}catch(error){$('detail').innerHTML=`<div class="empty status error">${esc(error.message)}</div>`}}
$('open').addEventListener('click',openFolder);$('rebuild').addEventListener('click',rebuild);$('search').addEventListener('input',applyFilters);$('quality').addEventListener('change',applyFilters);$('type').addEventListener('change',applyFilters);$('folder').addEventListener('keydown',event=>{if(event.key==='Enter')openFolder()});openFolder();
</script>
</body>
</html>
