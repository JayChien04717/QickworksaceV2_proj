<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qickworkspace Data Library</title>
<style>
:root{color-scheme:dark;--bg:#071119;--panel:#0e1b25;--panel2:#132532;--line:#263c4b;--text:#edf5f8;--muted:#91a7b5;--cyan:#50ddd3;--blue:#70aaff;--bad:#ff7c87;--good:#66dfa0;--warn:#f1c76d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#12384a 0,transparent 34%),var(--bg);color:var(--text);font:14px/1.45 Inter,"Segoe UI",sans-serif}.shell{max-width:1700px;margin:auto;padding:22px}.header{display:flex;justify-content:space-between;gap:20px;align-items:end}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:.15em;text-transform:uppercase}h1{font-size:29px;margin:4px 0}h2,h3{margin:10px 0}.muted{color:var(--muted)}.toolbar{display:grid;grid-template-columns:minmax(320px,1fr) auto auto auto;gap:8px;margin-top:16px}.filters{display:grid;grid-template-columns:minmax(260px,1fr) 180px 210px;gap:8px;margin:10px 0}.advanced-filters{display:grid;grid-template-columns:170px 170px minmax(210px,1fr) 160px auto;gap:8px;margin:-2px 0 10px}.date-filter{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:7px;padding-left:10px;border:1px solid var(--line);border-radius:8px;background:#0a1720;color:var(--muted)}.date-filter input{border:0;min-width:0;padding-left:2px}.tag-picker{position:relative;margin:0;padding:0;min-height:40px;background:#0a1720}.tag-picker summary{padding:9px 11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag-options{position:absolute;z-index:20;top:44px;left:-1px;right:-1px;max-height:260px;overflow:auto;padding:8px;background:#10222e;border:1px solid var(--line);border-radius:8px;box-shadow:0 14px 30px #0009}.tag-option{display:flex;align-items:center;gap:8px;padding:6px;border-radius:5px}.tag-option:hover{background:#193543}.tag-option span{overflow:hidden;text-overflow:ellipsis}.tag-empty{padding:12px;color:var(--muted)}input,select,button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:#0a1720;color:var(--text);padding:8px 11px}button{background:#18364a;cursor:pointer;font-weight:650}button:hover{filter:brightness(1.15)}button.primary{background:var(--cyan);color:#042126;border-color:transparent}button.ghost{background:transparent}.status{min-height:22px;color:var(--muted);margin:5px 2px}.status.error{color:var(--bad)}.layout{display:grid;grid-template-columns:minmax(600px,1.05fr) minmax(520px,.95fr);gap:14px}.panel{background:rgba(14,27,37,.96);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 16px 40px #0005}.table-wrap{max-height:75vh;overflow:auto}table{width:100%;border-collapse:collapse}th{position:sticky;top:0;background:#122632;text-align:left;color:var(--muted);padding:9px;border-bottom:1px solid var(--line);z-index:2}td{padding:9px;border-bottom:1px solid #1c303d;vertical-align:top}tr.data-row{cursor:pointer}tr.data-row:hover,tr.selected{background:#183442}td.check,th.check{width:38px;text-align:center}input[type=checkbox]{min-height:auto;accent-color:var(--cyan)}.mono{font:11px ui-monospace,Consolas,monospace;color:var(--muted)}.pill{display:inline-block;padding:2px 7px;margin:1px;border:1px solid var(--line);border-radius:99px;font-size:11px}.pill.good{color:var(--good)}.pill.bad{color:var(--bad)}.pill.suspect{color:var(--warn)}.workspace{min-height:75vh}.tabs{display:flex;border-bottom:1px solid var(--line);background:#0a1720}.tab{border:0;border-radius:0;background:transparent;color:var(--muted);padding:12px 17px}.tab.active{color:var(--cyan);box-shadow:inset 0 -2px var(--cyan)}.view{display:none;padding:15px;max-height:calc(75vh - 48px);overflow:auto}.view.active{display:block}.controls{display:grid;grid-template-columns:110px 1fr 110px auto;gap:7px;margin:10px 0}.chart{width:100%;height:360px;border:1px solid var(--line);border-radius:10px;background:#09151e;display:block}.chart text{fill:var(--muted);font-size:11px}.chart .grid{stroke:#223744;stroke-width:1}.chart .axis{stroke:#77909f;stroke-width:1}.legend{display:flex;flex-wrap:wrap;gap:12px;margin:8px 2px}.legend-item{display:flex;align-items:center;gap:6px}.swatch{width:16px;height:3px;border-radius:2px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.metric{padding:9px;border:1px solid var(--line);border-radius:8px}.metric small{display:block;color:var(--muted)}.fit-table th{position:static}.fit-table td,.fit-table th{padding:7px}.compare-bar{display:none;align-items:center;gap:9px;padding:9px 12px;margin-bottom:10px;background:#142c39;border:1px solid var(--line);border-radius:10px}.compare-bar.visible{display:flex}.compare-bar .spacer{flex:1}.notice{padding:9px 11px;border-left:3px solid var(--warn);background:#2b291c;border-radius:5px;margin:8px 0}.goodbox{border-left-color:var(--good);background:#142a22}.preview{width:100%;border-radius:9px;border:1px solid var(--line);background:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#08131b;border:1px solid var(--line);padding:9px;border-radius:7px;color:#cce3ed}.empty{padding:45px;text-align:center;color:var(--muted)}details{border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:8px}summary{cursor:pointer;font-weight:650}.count{font-variant-numeric:tabular-nums}.comment{max-width:210px;color:#bdd0d9}.fit-toggle{display:flex;gap:6px;align-items:center;white-space:nowrap}@media(max-width:1050px){.layout{grid-template-columns:1fr}.toolbar,.filters,.advanced-filters,.controls{grid-template-columns:1fr}.date-filter{grid-template-columns:90px 1fr}.shell{padding:12px}.workspace{min-height:560px}.metrics{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><main class="shell">
<div class="header"><div><div class="eyebrow">Native HDF5 + SQLite catalog</div><h1>Quantum Data Library</h1><div class="muted">搜尋、檢視 fitting、勾選多筆實驗並疊圖比較。</div></div></div>
<div class="toolbar"><input id="folder" placeholder="選擇 HDF5 資料根目錄" aria-label="Data folder"><button id="browse">選擇資料夾…</button><button id="open" class="primary">載入</button><button id="rebuild">重建索引</button></div>
<div id="status" class="status"></div>
<div class="filters"><input id="search" placeholder="搜尋實驗、ID、標籤、qubit 或註解"><select id="quality"><option value="">所有品質</option></select><select id="type"><option value="">所有實驗類型</option></select></div>
<div class="advanced-filters"><label class="date-filter"><span>開始日期</span><input id="startDate" type="date"></label><label class="date-filter"><span>結束日期</span><input id="endDate" type="date"></label><details id="tagPicker" class="tag-picker"><summary id="tagSummary">Tags：全部</summary><div id="tagOptions" class="tag-options"></div></details><select id="tagMode" aria-label="Tag matching mode"><option value="any">符合任一 Tag</option><option value="all">符合全部 Tags</option></select><button id="clearFilters" class="ghost">清除篩選</button></div>
<div id="compareBar" class="compare-bar"><b><span id="checkedCount">0</span> 筆已勾選</b><span id="compatibility" class="muted"></span><span class="spacer"></span><button id="clearCompare" class="ghost">清除</button><button id="compareNow" class="primary">比較所選資料</button></div>
<section class="layout">
<div class="panel table-wrap"><table><thead><tr><th class="check"><input id="checkAll" type="checkbox" title="勾選目前篩選結果"></th><th>時間 / ID</th><th>實驗</th><th>Qubit</th><th>品質</th><th>註解 / 標籤</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="panel workspace"><div class="tabs"><button class="tab active" data-tab="inspect">資料檢視</button><button class="tab" data-tab="compare">比較</button><button class="tab" data-tab="meta">詳細資訊</button></div><div id="inspect" class="view active"><div class="empty">載入資料夾後，點選左側實驗。</div></div><div id="compare" class="view"><div class="empty">勾選 2 筆以上資料，再按「比較所選資料」。</div></div><div id="meta" class="view"><div class="empty">尚未選擇實驗。</div></div></div>
</section></main>
<script>
const $=id=>document.getElementById(id), COLORS=['#50ddd3','#70aaff','#f1c76d','#ff7c87','#b795ff','#72df7f','#ff9f68','#e879c5'];
const savedFolder=localStorage.getItem('qick.hdf5.folder')||'';$('folder').value=savedFolder;
const state={experiments:[],filtered:[],selected:null,checked:new Set(),selectedTags:new Set(),info:null,trace:null};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStatus(m,e=false){$('status').textContent=m;$('status').className='status'+(e?' error':'')}
function api(path,extra=''){return `${path}?folder=${encodeURIComponent($('folder').value.trim())}${extra}`}
async function request(url,opt){const r=await fetch(url,opt);let b;try{b=await r.json()}catch{b={detail:await r.text()}}if(!r.ok)throw new Error(b.detail||`HTTP ${r.status}`);return b}
function tab(name){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===name))}
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>tab(x.dataset.tab));
function populateFilters(){for(const [id,key,label] of [['quality','quality','所有品質'],['type','experiment_type','所有實驗類型']]){const s=$(id),old=s.value,vals=[...new Set(state.experiments.map(x=>x[key]).filter(Boolean))].sort();s.innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');s.value=vals.includes(old)?old:''}populateTags()}
function populateTags(){const available=[...new Set(state.experiments.flatMap(x=>x.tags||[]).filter(Boolean))].sort((a,b)=>a.localeCompare(b));state.selectedTags=new Set([...state.selectedTags].filter(tag=>available.includes(tag)));$('tagOptions').innerHTML=available.length?available.map(tag=>`<label class="tag-option"><input type="checkbox" value="${esc(tag)}" ${state.selectedTags.has(tag)?'checked':''}><span>${esc(tag)}</span></label>`).join(''):'<div class="tag-empty">資料庫中沒有 tags</div>';document.querySelectorAll('#tagOptions input').forEach(input=>input.onchange=()=>{input.checked?state.selectedTags.add(input.value):state.selectedTags.delete(input.value);updateTagSummary();applyFilters()});updateTagSummary()}
function updateTagSummary(){const tags=[...state.selectedTags];$('tagSummary').textContent=tags.length?`Tags (${tags.length})：${tags.slice(0,2).join(', ')}${tags.length>2?'…':''}`:'Tags：全部'}
function activeFilterCount(){return[$('search').value,$('quality').value,$('type').value,$('startDate').value,$('endDate').value,state.selectedTags.size?1:''].filter(Boolean).length}
function applyFilters(){const q=$('search').value.trim().toLowerCase(),quality=$('quality').value,type=$('type').value,startText=$('startDate').value,endText=$('endDate').value,start=startText?new Date(`${startText}T00:00:00`):null,end=endText?new Date(`${endText}T23:59:59.999`):null,tags=[...state.selectedTags],tagMode=$('tagMode').value;if(start&&end&&start>end){state.filtered=[];renderRows();setStatus('開始日期不可晚於結束日期。',true);return}state.filtered=state.experiments.filter(x=>{const text=[x.experiment_type,x.experiment_id,x.comment_preview,...(x.tags||[]),...(x.qubits||[])].join(' ').toLowerCase(),stamp=new Date(x.timestamp_local),dateMatch=(!start||stamp>=start)&&(!end||stamp<=end),tagMatch=!tags.length||(tagMode==='all'?tags.every(tag=>(x.tags||[]).includes(tag)):tags.some(tag=>(x.tags||[]).includes(tag)));return(!q||text.includes(q))&&(!quality||x.quality===quality)&&(!type||x.experiment_type===type)&&dateMatch&&tagMatch});renderRows()}
function clearFilters(){for(const id of ['search','quality','type','startDate','endDate'])$(id).value='';$('tagMode').value='any';state.selectedTags.clear();document.querySelectorAll('#tagOptions input').forEach(input=>input.checked=false);updateTagSummary();applyFilters()}
function renderRows(){$('rows').innerHTML=state.filtered.map(x=>`<tr class="data-row ${state.selected===x.experiment_id?'selected':''}" data-id="${esc(x.experiment_id)}"><td class="check"><input class="pick" type="checkbox" ${state.checked.has(x.experiment_id)?'checked':''} aria-label="選取比較"></td><td>${esc(new Date(x.timestamp_local).toLocaleString())}<div class="mono">${esc(x.experiment_id)}</div></td><td><b>${esc(x.experiment_type)}</b></td><td>${x.qubits.map(q=>`<span class="pill">${esc(q)}</span>`).join('')||'—'}</td><td><span class="pill ${esc(x.quality)}">${esc(x.quality)}</span></td><td class="comment">${esc(x.comment_preview||'')}<div>${x.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div></td></tr>`).join('');document.querySelectorAll('.data-row').forEach(row=>{row.onclick=e=>{if(e.target.classList.contains('pick'))return;showExperiment(row.dataset.id)};row.querySelector('.pick').onchange=e=>toggleChecked(row.dataset.id,e.target.checked)});$('checkAll').checked=state.filtered.length>0&&state.filtered.every(x=>state.checked.has(x.experiment_id));const filterCount=activeFilterCount();setStatus(`${state.filtered.length} / ${state.experiments.length} 筆實驗${filterCount?` · ${filterCount} 個篩選條件`:``}`);updateCompareBar()}
function toggleChecked(id,on){on?state.checked.add(id):state.checked.delete(id);renderRows()}
function updateCompareBar(){const selected=state.experiments.filter(x=>state.checked.has(x.experiment_id)),types=[...new Set(selected.map(x=>x.experiment_type))];$('checkedCount').textContent=selected.length;$('compareBar').classList.toggle('visible',selected.length>0);$('compatibility').textContent=types.length>1?'包含不同實驗類型，仍可疊圖但請確認座標意義。':selected.length>1?`${types[0]} · 可直接比較`:''}
async function browse(){setStatus('正在開啟 Windows 資料夾選擇視窗…');try{const d=await request(`/api/choose-folder?initial=${encodeURIComponent($('folder').value.trim())}`);if(d.folder){$('folder').value=d.folder;await openFolder()}else setStatus('已取消選擇')}catch(e){setStatus(e.message,true)}}
async function openFolder(){setStatus('載入 catalog…');try{const d=await request(api('/api/catalog','&limit=10000'));state.experiments=d.experiments;state.filtered=d.experiments;state.selected=null;state.checked.clear();localStorage.setItem('qick.hdf5.folder',d.folder);$('folder').value=d.folder;populateFilters();applyFilters();$('inspect').innerHTML=`<div class="empty">已載入 ${d.count} 筆實驗。點選表格資料，或勾選多筆進行比較。</div>`;$('meta').innerHTML='<div class="empty">尚未選擇實驗。</div>'}catch(e){setStatus(e.message,true)}}
async function rebuild(){setStatus('掃描 HDF5 並重建 SQLite 索引…');try{const d=await request(api('/api/rebuild'),{method:'POST'});setStatus(`已索引 ${d.indexed} 筆實驗`);await openFolder()}catch(e){setStatus(e.message,true)}}
function datasetOptions(info){return ['raw','analysis'].flatMap(src=>(info.datasets[src]||[]).filter(d=>d.numeric).map(d=>`<option value="${src}|${esc(d.name)}">${src}/${esc(d.name)} · ${esc(d.shape.join('×')||'scalar')}</option>`)).join('')}
function fitRows(fit){const rows=Object.entries(fit||{});if(!rows.length)return '<div class="muted">此檔案沒有 named fit result。</div>';return `<table class="fit-table"><thead><tr><th>參數</th><th>數值</th><th>誤差</th></tr></thead><tbody>${rows.map(([k,v])=>{const a=Array.isArray(v)?v:[v,null];return `<tr><td><b>${esc(k)}</b></td><td>${fmt(a[0])}</td><td>${a[1]==null?'—':fmt(a[1])}</td></tr>`}).join('')}</tbody></table>`}
const fmt=v=>typeof v==='number'?(Math.abs(v)>=1e4||Math.abs(v)<1e-3&&v!==0?v.toExponential(5):Number(v.toPrecision(7)).toString()):esc(v);
async function showExperiment(id){state.selected=id;renderRows();tab('inspect');$('inspect').innerHTML='<div class="empty">讀取 HDF5…</div>';try{const info=await request(api(`/api/experiment/${encodeURIComponent(id)}`));state.info=info;const defaultSet=(info.datasets.raw||[]).find(d=>d.name==='iq')||(info.datasets.raw||[]).find(d=>d.numeric)||(info.datasets.analysis||[]).find(d=>d.numeric);$('inspect').innerHTML=`<h2>${esc(info.experiment_type)}</h2><div class="metrics"><div class="metric"><small>Quality</small>${esc(info.quality)}</div><div class="metric"><small>Qubit</small>${esc((info.qubits||[]).join(', ')||'—')}</div><div class="metric"><small>Analysis</small>${esc(info.analysis_id||'—')}</div><div class="metric"><small>Data kind</small>${esc(info.data_kind||'—')}</div></div><div class="controls"><select id="datasetSource">${datasetOptions(info)}</select><select id="channel"><option value="auto">自動 / amplitude</option><option value="real">I / real</option><option value="imag">Q / imag</option><option value="phase">phase</option><option value="abs">amplitude</option></select><label class="fit-toggle"><input id="showFit" type="checkbox" checked> Fit line</label><button id="draw">更新圖表</button></div><div id="chartMessage"></div><svg id="singleChart" class="chart" role="img"></svg><div id="singleLegend" class="legend"></div><h3>Fitting 結果</h3>${fitRows(info.fit_result)}`;if(defaultSet){const defaultSource=(info.datasets.raw||[]).includes(defaultSet)?'raw':'analysis';$('datasetSource').value=`${defaultSource}|${defaultSet.name}`;}$('draw').onclick=drawSingle;$('showFit').onchange=()=>drawTraceChart('singleChart','singleLegend',[state.trace],{showFit:$('showFit').checked});await drawSingle();renderMeta(info)}catch(e){$('inspect').innerHTML=`<div class="empty status error">${esc(e.message)}</div>`}}
async function drawSingle(){const [source,dataset]=$('datasetSource').value.split('|'),channel=$('channel').value;$('chartMessage').innerHTML='';try{const t=await request(api(`/api/trace/${encodeURIComponent(state.selected)}`,`&source=${encodeURIComponent(source)}&dataset=${encodeURIComponent(dataset)}&channel=${channel}`));state.trace=t;const notices=[];if(t.reduction!=='none')notices.push(`${esc(t.shape.join('×'))} 多維資料目前以「${esc(t.reduction)}」轉為曲線。`);if(!t.fit)notices.push('此檔案未儲存 analysis/fit_curve，因此只顯示量測資料，不臆測 fitting line。');$('chartMessage').innerHTML=notices.map(x=>`<div class="notice">${x}</div>`).join('');drawTraceChart('singleChart','singleLegend',[t],{showFit:$('showFit').checked})}catch(e){$('chartMessage').innerHTML=`<div class="notice">${esc(e.message)}</div>`;$('singleChart').innerHTML=''}}
function renderMeta(i){$('meta').innerHTML=`<h2>實驗詳細資訊</h2><div class="notice ${i.valid?'goodbox':''}">${i.valid?'HDF5 schema 驗證通過':`驗證失敗：${esc((i.validation_errors||[]).join('; '))}`}</div><h3>檔案</h3><pre>${esc(i.path)}</pre><h3>資料集</h3><table class="fit-table"><thead><tr><th>路徑</th><th>Shape</th><th>Dims</th><th>Dtype</th></tr></thead><tbody>${['raw','analysis'].flatMap(s=>(i.datasets[s]||[]).map(d=>`<tr><td>${s}/${esc(d.name)}</td><td>${esc(d.shape.join('×')||'scalar')}</td><td>${esc(d.dims.join(', ')||'—')}</td><td>${esc(d.dtype)}</td></tr>`)).join('')}</tbody></table><details><summary>Axes</summary><pre>${esc(JSON.stringify(i.axes,null,2))}</pre></details><details><summary>Metadata</summary><pre>${esc(JSON.stringify(i.metadata,null,2))}</pre></details><details><summary>Config</summary><pre>${esc(JSON.stringify(i.config,null,2))}</pre></details><details><summary>Validation warnings</summary><pre>${esc(JSON.stringify(i.validation_warnings,null,2))}</pre></details><details><summary>儲存的 preview</summary><img class="preview" src="${api(`/api/plot/${encodeURIComponent(i.experiment_id)}`,'&name=preview.png')}&v=${Date.now()}"></details>`}
async function compareSelected(){const rows=state.experiments.filter(x=>state.checked.has(x.experiment_id));if(rows.length<2){setStatus('請至少勾選 2 筆資料',true);return}tab('compare');$('compare').innerHTML='<div class="empty">讀取比較資料…</div>';const source='raw',dataset='iq';const settled=await Promise.allSettled(rows.slice(0,12).map(x=>request(api(`/api/trace/${encodeURIComponent(x.experiment_id)}`,`&source=${source}&dataset=${dataset}&channel=auto`))));const traces=settled.filter(x=>x.status==='fulfilled').map(x=>x.value),failed=settled.length-traces.length;if(!traces.length){$('compare').innerHTML='<div class="empty status error">所選檔案沒有可比較的 raw/iq 曲線。</div>';return}const units=[...new Set(traces.map(t=>`${t.x_label}|${t.x_unit}`))];$('compare').innerHTML=`<h2>多檔疊圖比較</h2><div class="controls"><select id="compareChannel"><option value="auto">amplitude / auto</option><option value="real">I / real</option><option value="imag">Q / imag</option><option value="phase">phase</option></select><select id="compareDataset"><option value="raw|iq">raw/iq</option></select><label class="fit-toggle"><input id="normalize" type="checkbox"> 各曲線正規化</label><button id="reloadCompare">更新比較</button></div>${units.length>1?'<div class="notice">所選資料的 X 軸名稱或單位不同，疊圖僅供探索，請勿直接比較絕對座標。</div>':''}${failed?`<div class="notice">${failed} 筆資料無法讀取 raw/iq，已略過。</div>`:''}<svg id="compareChart" class="chart"></svg><div id="compareLegend" class="legend"></div><h3>Fit 參數對照</h3>${compareFitTable(traces)}`;$('normalize').onchange=()=>drawTraceChart('compareChart','compareLegend',traces,{normalize:$('normalize').checked,showFit:false});$('reloadCompare').onclick=reloadCompare;drawTraceChart('compareChart','compareLegend',traces,{showFit:false})}
async function reloadCompare(){const channel=$('compareChannel').value,rows=state.experiments.filter(x=>state.checked.has(x.experiment_id));$('compare').querySelector('svg').style.opacity=.35;const traces=(await Promise.allSettled(rows.slice(0,12).map(x=>request(api(`/api/trace/${encodeURIComponent(x.experiment_id)}`,`&source=raw&dataset=iq&channel=${channel}`))))).filter(x=>x.status==='fulfilled').map(x=>x.value);drawTraceChart('compareChart','compareLegend',traces,{normalize:$('normalize').checked,showFit:false})}
function compareFitTable(ts){const keys=[...new Set(ts.flatMap(t=>Object.keys(t.fit_result||{})))];if(!keys.length)return '<div class="muted">所選資料沒有 fit result。</div>';return `<div class="table-wrap" style="max-height:240px"><table class="fit-table"><thead><tr><th>實驗</th>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${ts.map(t=>`<tr><td><div>${esc(t.experiment_type)}</div><div class="mono">${esc(t.experiment_id.slice(-13))}</div></td>${keys.map(k=>`<td>${t.fit_result?.[k]===undefined?'—':fmt(Array.isArray(t.fit_result[k])?t.fit_result[k][0]:t.fit_result[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function drawTraceChart(svgId,legendId,traces,opt={}){const svg=$(svgId);if(!svg||!traces?.length)return;const W=900,H=360,m={l:66,r:18,t:22,b:52},valid=traces.map((t,i)=>{let y=t.y.map(Number);if(opt.normalize){const lo=Math.min(...y),hi=Math.max(...y),d=hi-lo||1;y=y.map(v=>(v-lo)/d)}return{...t,y,color:COLORS[i%COLORS.length]}});const xs=valid.flatMap(t=>t.x.map(Number)).filter(Number.isFinite),ys=valid.flatMap(t=>t.y).filter(Number.isFinite);if(!xs.length||!ys.length){svg.innerHTML='<text x="20" y="30">No finite numeric data</text>';return}let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);if(xmin===xmax){xmin-=.5;xmax+=.5}if(ymin===ymax){ymin-=.5;ymax+=.5}const py=v=>m.t+(ymax-v)/(ymax-ymin)*(H-m.t-m.b),px=v=>m.l+(v-xmin)/(xmax-xmin)*(W-m.l-m.r);const line=(x,y)=>x.map((v,i)=>`${i?'L':'M'}${px(v).toFixed(1)},${py(y[i]).toFixed(1)}`).join(' ');let html='';for(let i=0;i<=5;i++){const x=xmin+(xmax-xmin)*i/5,y=ymin+(ymax-ymin)*i/5;html+=`<line class="grid" x1="${px(x)}" x2="${px(x)}" y1="${m.t}" y2="${H-m.b}"/><text x="${px(x)}" y="${H-m.b+20}" text-anchor="middle">${fmt(x)}</text><line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${py(y)}" y2="${py(y)}"/><text x="${m.l-8}" y="${py(y)+4}" text-anchor="end">${fmt(y)}</text>`}html+=`<line class="axis" x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}"/><line class="axis" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${H-m.b}"/>`;valid.forEach(t=>{html+=`<path d="${line(t.x,t.y)}" fill="none" stroke="${t.color}" stroke-width="1.8" opacity=".9"/>`;if(opt.showFit&&t.fit){html+=`<path d="${line(t.x,t.fit)}" fill="none" stroke="#ff6574" stroke-width="3" stroke-dasharray="8 5"/>`}});const label=`${valid[0].x_label||'x'}${valid[0].x_unit?` (${valid[0].x_unit})`:''}`;html+=`<text x="${(m.l+W-m.r)/2}" y="${H-9}" text-anchor="middle">${esc(label)}</text><text transform="translate(16 ${(m.t+H-m.b)/2}) rotate(-90)" text-anchor="middle">${esc(opt.normalize?'normalized':valid[0].y_label||'signal')}</text>`;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=html;const legend=$(legendId);if(legend)legend.innerHTML=valid.map(t=>`<span class="legend-item"><i class="swatch" style="background:${t.color}"></i>${esc(t.experiment_type)} <span class="mono">${esc(t.experiment_id.slice(-8))}</span></span>`).join('')+(opt.showFit&&valid.some(t=>t.fit)?'<span class="legend-item"><i class="swatch" style="background:#ff6574"></i>fitting line</span>':'')}
$('browse').onclick=browse;$('open').onclick=openFolder;$('rebuild').onclick=rebuild;$('compareNow').onclick=compareSelected;$('clearCompare').onclick=()=>{state.checked.clear();renderRows()};$('clearFilters').onclick=clearFilters;$('checkAll').onchange=e=>{state.filtered.forEach(x=>e.target.checked?state.checked.add(x.experiment_id):state.checked.delete(x.experiment_id));renderRows()};$('search').oninput=applyFilters;for(const id of ['quality','type','startDate','endDate','tagMode'])$(id).onchange=applyFilters;$('folder').onkeydown=e=>{if(e.key==='Enter')openFolder()};if($('folder').value.trim())openFolder();else setStatus('請按「選擇資料夾…」指定 HDF5 資料庫。');
</script></body></html>
